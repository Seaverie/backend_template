name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      TC_DATABASE_URL: postgresql+asyncpg://tc_app:app_ci_pw@127.0.0.1:5432/tenantcore
      TC_DDL_DATABASE_URL: postgresql+asyncpg://tc_owner:owner_ci_pw@127.0.0.1:5432/tenantcore
      TC_REDIS_URL: redis://127.0.0.1:6379/15
      TC_REQUIRE_INTEGRATION: "1"  # fail, never silently skip, if services are missing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check app tests
      - name: Type check
        run: mypy app
      - name: Dependency audit
        run: pip-audit --skip-editable
      - name: Bootstrap database roles
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          TC_OWNER_PASSWORD: owner_ci_pw
          TC_APP_PASSWORD: app_ci_pw
        run: ./infra/postgres/01-roles.sh
      - name: Migration round trip (upgrade -> downgrade -> upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Tests (unit + integration against real PostgreSQL/Redis)
        run: pytest -q -rs
