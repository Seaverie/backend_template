[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tenantcore"
version = "0.1.0"
description = "Hybrid multi-tenant FastAPI backend: RLS-isolated control plane, dynamic schema, RBAC."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",  # spec: SQLAlchemy 2.0; OTel instrumentation supports <2.1
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "cryptography>=43",
  "httpx>=0.27",
  "celery[redis]>=5.4",
  "segno>=1.6",
  "python-multipart>=0.0.18",  # UploadFile (import endpoint)
  "openpyxl>=3.1",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-redis>=0.48b0",
  "opentelemetry-instrumentation-celery>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
mysql = ["aiomysql>=0.2"]
oracle = ["oracledb>=2.4"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "locust>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PL"]
ignore = [
  "PLR0913",  # FastAPI handlers legitimately take many dependencies
  "PLR2004",
  "PLR0911",
  "PLR0912",
  "B008",     # FastAPI Depends() in defaults is idiomatic
  "RUF012",
  "PLR0917",  # keyword-heavy service signatures; positional count is not a useful signal here
  "PLR0915",
  "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S608", "PLR0915", "S311", "ASYNC109", "ASYNC240"]
"loadtest/**" = ["S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "boto3.*", "botocore.*", "aiomysql.*", "oracledb.*", "celery.*", "kombu.*", "segno.*", "openpyxl.*", "locust.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.tasks", "app.workers.celery_app"]
disallow_untyped_decorators = false
disallow_subclassing_any = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL and Redis (TC_TEST_* env vars)",
]
