# Local stack: PostgreSQL, Redis and the API.  Copy .env.example to .env first.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TC_DB_OWNER_PASSWORD: ${TC_DB_OWNER_PASSWORD:?set TC_DB_OWNER_PASSWORD in .env}
      TC_DB_APP_PASSWORD: ${TC_DB_APP_PASSWORD:?set TC_DB_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenantcore"]
      interval: 3s
      retries: 20
    # Only for tools on your machine (psql, DBeaver). Change POSTGRES_HOST_PORT if 5432 is taken.
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build: .
    env_file: .env
    environment:
      TC_DB_URL: jdbc:postgresql://postgres:5432/tenantcore
      TC_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TC_STORAGE_DIR: /app/storage
      TC_BACKUP_DIR: /app/backups
      TC_BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - storage:/app/storage
      - backups:/app/backups:ro   # read-only: the dashboard only shows backup status
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # Point Cloudflare Tunnel (or a reverse proxy) at this port.
    ports: ["127.0.0.1:${API_HOST_PORT:-8000}:8000"]
    restart: unless-stopped

  # Nightly backups: a pg_dump of the database plus a tarball of the file storage, kept
  # BACKUP_KEEP_DAYS days in the "backups" volume. Copy that volume off this machine too (rclone,
  # restic, ...): a backup on the same disk does not survive the disk. Restore: see README.
  backup:
    image: postgres:16
    entrypoint: ["bash", "/opt/backup/loop.sh"]   # bash: works even if the executable bit was lost
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: tenantcore
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./infra/backup:/opt/backup:ro
      - backups:/backups
      - storage:/storage
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  # Catches every email locally: open http://localhost:8025 to read them. In the platform email
  # settings use host "mailpit", port 1025, security "none". Use a real SMTP service in production.
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"]

volumes:
  pgdata:
  redisdata:
  storage:
  backups:
